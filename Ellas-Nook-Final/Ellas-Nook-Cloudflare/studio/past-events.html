<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><title>Past Events · Ella’s Studio</title><link href="https://fonts.googleapis.com/css2?family=Fraunces:wght@500;700&family=Nunito:wght@400;700&display=swap" rel="stylesheet"><link rel="stylesheet" href="studio.css"><style>
body{background:#f7f1e7;color:#347f89}.wrap{max-width:1100px;margin:auto;padding:24px}.top{display:flex;align-items:center;gap:12px;flex-wrap:wrap}.top h1{font-family:Fraunces,serif;margin-right:auto}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(250px,1fr));gap:16px;margin-top:22px}.event{background:#fffdf8;border:1px solid #e9ddca;border-radius:18px;padding:18px;box-shadow:0 8px 22px #735c3a0d}.event img{width:100%;height:145px;object-fit:cover;border-radius:12px;margin:8px 0}.event h3{font-family:Fraunces,serif;margin:6px 0}.event p{white-space:pre-wrap}.actions{display:flex;gap:10px;flex-wrap:wrap}.login{max-width:420px;margin:8vh auto;padding:24px;background:#fffdf8;border-radius:22px}.login input,.editor input,.editor textarea,.editor select{width:100%;font:inherit;padding:11px;border:1px solid #b6c9c5;border-radius:10px;background:white;color:#285e66}.field{display:grid;gap:6px;margin:12px 0}.editor{max-width:620px}.muted{opacity:.75}.hidden{display:none!important}.status{font-size:.85rem;padding:4px 8px;border-radius:20px;background:#e6efe7}.cursor-dot{position:fixed;z-index:1000;pointer-events:none;width:22px;height:22px;border:2px solid #57a0aa;border-radius:50%;transform:translate(-50%,-50%) scale(.4);animation:ripple .55s ease-out forwards}@keyframes ripple{to{opacity:0;transform:translate(-50%,-50%) scale(2.4)}}@media(hover:hover) and (pointer:fine){.cursor-dot{width:8px;height:8px;border:0;background:#57a0aa;box-shadow:0 0 0 4px #57a0aa22;animation:trail .6s ease-out forwards}@keyframes trail{to{opacity:0;transform:translate(-50%,-50%) scale(2.8)}}}
</style></head><body><section id="login" class="login"><h1>Ella’s Studio</h1><p>Sign in to manage Past Events.</p><form id="lf"><div class="field"><label for="email">Admin email</label><input id="email" type="email" required autocomplete="username"></div><div class="field"><label for="password">Password</label><input id="password" type="password" required autocomplete="current-password"></div><button class="btn" type="submit">Sign in</button><p id="loginmsg" role="status"></p></form></section><main id="app" class="wrap hidden"><div class="top"><h1>Past Events</h1><a class="btn ghost" href="index.html">Ella’s Studio</a><button class="btn ghost" id="logout">Sign out</button><button class="btn" id="new">+ Add past event</button></div><p class="muted">Edit every existing past event, including its title, date label, description, photo, order and visibility. Published events appear on the public website.</p><section id="editor" class="event editor hidden"><h2 id="formtitle">Add past event</h2><form id="ef"><div class="field"><label for="date">Date label (e.g. Oct 05)</label><input id="date" maxlength="80"></div><div class="field"><label for="title">Event title</label><input id="title" maxlength="180" required></div><div class="field"><label for="description">Description</label><textarea id="description" rows="5" maxlength="8000"></textarea></div><div class="field"><label for="image">Photo URL (optional)</label><input id="image" type="url" placeholder="https://... or /media/..."></div><div class="field"><label for="order">Display order</label><input id="order" type="number" min="0" step="1" value="1"></div><div class="field"><label for="status">Visibility</label><select id="status"><option value="published">Published</option><option value="draft">Draft</option></select></div><div class="actions"><button class="btn" type="submit">Save event</button><button class="btn ghost" type="button" id="cancel">Cancel</button><button class="btn danger" type="button" id="delete" hidden>Delete event</button></div><p id="formmsg" role="status"></p></form></section><p id="msg" role="status"></p><section id="list" class="grid"></section></main><script>
const $=s=>document.querySelector(s);let items=[],editing=null;async function api(path,opts={}){const r=await fetch(path,{credentials:'same-origin',headers:{'content-type':'application/json',...(opts.headers||{})},...opts});const data=await r.json().catch(()=>({}));if(!r.ok)throw Error(data.error||'Request failed');return data}function message(s){$('#msg').textContent=s}function showEditor(item){editing=item||null;$('#editor').classList.remove('hidden');$('#formtitle').textContent=item?'Edit past event':'Add past event';$('#date').value=item?.date_label||'';$('#title').value=item?.title||'';$('#description').value=item?.description||'';$('#image').value=item?.image_url||'';$('#order').value=item?.sort_order??(items.length+1);$('#status').value=item?.status||'published';$('#delete').hidden=!item;$('#formmsg').textContent='';$('#editor').scrollIntoView({behavior:'smooth',block:'start'})}function render(){const list=$('#list');list.replaceChildren();items.forEach(item=>{const card=document.createElement('article');card.className='event';const tag=document.createElement('span');tag.className='status';tag.textContent=item.status;card.append(tag);if(item.image_url){const im=document.createElement('img');im.src=item.image_url;im.alt=item.title;im.loading='lazy';card.append(im)}const date=document.createElement('p');date.className='muted';date.textContent=item.date_label||'Date not specified';const title=document.createElement('h3');title.textContent=item.title;const desc=document.createElement('p');desc.textContent=item.description||'';const edit=document.createElement('button');edit.className='btn';edit.textContent='Edit';edit.onclick=()=>showEditor(item);card.append(date,title,desc,edit);list.append(card)})}async function load(){message('Loading events…');items=await api('/api/admin/data/past_events?order=sort_order.asc');render();message(items.length?`${items.length} past events`: 'No past events yet. Add the first one.')}$('#lf').onsubmit=async e=>{e.preventDefault();$('#loginmsg').textContent='Signing in…';try{await api('/api/admin/login',{method:'POST',body:JSON.stringify({email:$('#email').value,password:$('#password').value})});$('#login').classList.add('hidden');$('#app').classList.remove('hidden');await load()}catch(x){$('#loginmsg').textContent=x.message}};$('#ef').onsubmit=async e=>{e.preventDefault();const row={date_label:$('#date').value.trim(),title:$('#title').value.trim(),description:$('#description').value.trim(),image_url:$('#image').value.trim()||null,sort_order:Number($('#order').value)||0,status:$('#status').value};$('#formmsg').textContent='Saving…';try{if(editing)await api('/api/admin/data/past_events/'+encodeURIComponent(editing.id),{method:'PATCH',body:JSON.stringify(row)});else await api('/api/admin/data/past_events',{method:'POST',body:JSON.stringify(row)});$('#editor').classList.add('hidden');await load()}catch(x){$('#formmsg').textContent=x.message}};$('#new').onclick=()=>showEditor(null);$('#cancel').onclick=()=>$('#editor').classList.add('hidden');$('#delete').onclick=async()=>{if(!editing||!confirm('Delete this past event permanently?'))return;try{await api('/api/admin/data/past_events/'+encodeURIComponent(editing.id),{method:'DELETE'});$('#editor').classList.add('hidden');await load()}catch(x){$('#formmsg').textContent=x.message}};$('#logout').onclick=async()=>{await api('/api/admin/logout',{method:'POST'});location.reload()};api('/api/admin/me').then(async()=>{$('#login').classList.add('hidden');$('#app').classList.remove('hidden');await load()}).catch(()=>{});
// Cursor interaction: subtle trail on desktop and tap ripple on touch screens.
let last=0;document.addEventListener('pointermove',e=>{if(e.pointerType!=='mouse'||matchMedia('(prefers-reduced-motion: reduce)').matches||performance.now()-last<70)return;last=performance.now();const d=document.createElement('i');d.className='cursor-dot';d.style.left=e.clientX+'px';d.style.top=e.clientY+'px';document.body.append(d);d.addEventListener('animationend',()=>d.remove(),{once:true})},{passive:true});document.addEventListener('pointerdown',e=>{if(e.pointerType==='mouse'||matchMedia('(prefers-reduced-motion: reduce)').matches)return;const d=document.createElement('i');d.className='cursor-dot';d.style.left=e.clientX+'px';d.style.top=e.clientY+'px';document.body.append(d);d.addEventListener('animationend',()=>d.remove(),{once:true})},{passive:true});
</script></body></html>
