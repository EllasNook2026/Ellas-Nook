<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self'; style-src 'self' https://fonts.googleapis.com; font-src https://fonts.gstatic.com; img-src 'self' blob: data:; connect-src 'self'; base-uri 'none'; form-action 'none'">
<title>Ella's Studio</title>
<link rel="icon" href="../assets/logo.jpg">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:wght@500;700&family=Nunito:wght@400;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="studio.css">
</head><body>

<div class="login" id="login">
  <div class="login-card">
    <img class="logo" src="../assets/logo.jpg" alt="Ella's Nook logo">
    <h1>Ella's Studio</h1>
    <form id="lf" autocomplete="on">
      <div class="field"><label for="le">Email</label><input id="le" type="email" autocomplete="username" required></div>
      <div class="field"><label for="lp">Password</label><input id="lp" type="password" autocomplete="current-password" required></div>
      <button class="btn" type="submit" id="lb">Sign in</button>
      <p class="msg" id="lm" role="status"></p>
    </form>
  </div>
</div>

<div id="app" hidden>
  <header>
    <span class="brand"><img src="../assets/logo.jpg" alt="">Ella's Studio</span>
    <nav aria-label="Studio">
      <button data-tab="calendar">Calendar</button>
      <button data-tab="blog">Blog</button><button data-tab="combos">Combos</button>
      <button data-tab="feedback">Feedback<span class="badge" id="fbn" hidden></span></button>
    </nav>
    <button class="btn ghost sm" id="out">Sign out</button>
  </header>
  <main id="view"></main>
</div>

<dialog id="dlg"></dialog>
<dialog id="ask"><p id="askq"></p><div class="actions"><button class="btn danger" id="askok">OK</button><button class="btn ghost" id="askno">Cancel</button></div></dialog>
<div id="toast" role="status" hidden></div>

<script src="config.js"></script>
<script src="studio.js"></script><script src="combos.js"></script>
</body></html>
