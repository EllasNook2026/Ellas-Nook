name = "ellas-nook-public"
main = "src/public-entry.js"
compatibility_date = "2026-10-10"

[assets]
directory = "./public"
binding = "ASSETS"
run_worker_first = ["/api/*", "/media/*", "/studio", "/studio/*"]

[[d1_databases]]
binding = "DB"
database_name = "ellas-nook-db"
database_id = "9fb6c77c-93c1-4380-b663-6a5c1f91dd11"

[[r2_buckets]]
binding = "MEDIA"
bucket_name = "ellas-nook-media"
